[package]
name = "terdo"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.27"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
toml = "0.8"
dirs = "5.0"
unicode-width = "0.1"
arboard = "3.3"
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
